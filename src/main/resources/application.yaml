spring:
  config:
    import: optional:file:./local.properties
  application:
    name: ForYourWishes
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
app:
  security:
    jwt:
      issuer: for-your-wishes
      audience: for-your-wishes-api
      access-token-ttl: 15m
      public-key: file:./secrets/public.pem
      private-key: file:./secrets/private.pem